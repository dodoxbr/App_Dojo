name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector
      - run: npx supabase db reset
      - run: npx supabase test db
      - name: Smoke test do fluxo de auth
        run: |
          eval "$(npx supabase status -o env | grep -E "^(API_URL|ANON_KEY)=" | sed "s/^API_URL=/export SUPABASE_URL=/; s/^ANON_KEY=/export SUPABASE_ANON_KEY=/")"
          node scripts/smoke-auth.mjs
          node scripts/smoke-academy.mjs
          node scripts/smoke-membership.mjs
          node scripts/smoke-catalog.mjs
          node scripts/smoke-diary.mjs
      - run: npx supabase stop --no-backup
        if: always()

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  catalog:
    # The committed seed must be exactly what the scripts generate from the spreadsheet.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I scripts/catalog/extract_catalog.py
      - run: python -I scripts/catalog/generate_seed.py
      - run: git diff --exit-code -- data supabase/migrations
