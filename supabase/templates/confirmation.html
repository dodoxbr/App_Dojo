<!doctype html>
<html lang="pt-BR">
  <body style="font-family: Arial, Helvetica, sans-serif; color: #142235; line-height: 1.5;">
    <h2 style="color: #183b63;">Confirme o seu cadastro</h2>
    <p>Bem-vindo ao Oss! Falta só confirmar o seu e-mail.</p>
    <p><a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 12px 20px; color: #ffffff; background: #183b63; border-radius: 8px; text-decoration: none; font-weight: bold;">Confirmar o e-mail</a></p>

    <p>Se você não criou esta conta, ignore esta mensagem.</p>
